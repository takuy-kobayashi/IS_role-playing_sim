<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS Roleplay Case Simulator - Apple Design Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&family=SF+Pro+Text:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --accent-blue: #0071e3;
            --accent-green: #34c759;
            --border-color: rgba(0,0,0,0.08);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 100px;
        }

        /* Apple Navigation Bar */
        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            height: 48px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .nav-logo {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* Hero / Main Area */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 96px 24px 24px 24px;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero-section h1 {
            font-size: 40px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 12px;
        }

        .hero-section p {
            color: var(--text-sub);
            font-size: 17px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Card Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            transition: all 0.4s ease;
        }

        .grid-container.blur-bg {
            filter: blur(8px);
            opacity: 0.3;
            pointer-events: none;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .case-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .case-id {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            background: #f2f2f7;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .difficulty {
            color: #ff9500;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .case-target {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }

        .case-tone {
            font-size: 13px;
            font-style: italic;
            color: #e54646;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .meta-tag {
            display: inline-block;
            font-size: 11px;
            background: #f2f2f7;
            padding: 4px 10px;
            border-radius: 6px;
            margin-right: 6px;
            margin-bottom: 12px;
            color: #48484a;
        }

        .card-footer-info {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        /* Modal View (Popup) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: rgba(0,0,0,0.15);
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-window {
            background: #ffffff;
            width: 90%;
            max-width: 680px;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            overflow-y: auto;
            position: relative;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 36px;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1) translateY(0);
        }

        .modal-close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: #f2f2f7;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            background: #e5e5ea;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-blue);
            margin-top: 20px;
            margin-bottom: 6px;
            border-left: 2px solid var(--accent-blue);
            padding-left: 8px;
        }

        .section-content {
            font-size: 14px;
            color: #3a3a3c;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .highlight-box {
            background: #f8f9fa;
            border: 1px dashed #0071e3;
            padding: 16px;
            border-radius: 12px;
            margin-top: 14px;
        }

        .highlight-box .section-title {
            color: var(--accent-green);
            border-left-color: var(--accent-green);
            margin-top: 0;
        }

        /* Filter Controls */
        .filter-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 980px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }

        /* Large Random Button Centered Container */
        .random-large-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-random-large {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            border-radius: 980px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
        }

        .btn-random-large:hover {
            opacity: 0.95;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.35);
        }

        .btn-random-large:active {
            transform: scale(0.98);
        }

        /* Editor form and Action buttons styles */
        .section-title-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-blue);
            margin-top: 14px;
            margin-bottom: 6px;
            border-left: 2px solid var(--accent-blue);
            padding-left: 8px;
        }

        .edit-input, .edit-textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f5f5f7;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
        }

        .edit-input:focus, .edit-textarea:focus {
            background: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .edit-textarea {
            resize: vertical;
        }

        .edit-field {
            margin-bottom: 12px;
        }

        .highlight-box-edit {
            background: #f8f9fa;
            border: 1px dashed var(--accent-green);
            padding: 14px;
            border-radius: 12px;
            margin-top: 14px;
        }

        .action-btn {
            padding: 8px 18px;
            border-radius: 980px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .primary-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .secondary-btn {
            background-color: #f2f2f7;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .secondary-btn:hover {
            background-color: #e5e5ea;
        }

        .edited-badge {
            background: rgba(52, 199, 89, 0.15);
            color: var(--accent-green);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="nav-logo">IS Training Simulator</div>
            <button class="action-btn secondary-btn" style="padding: 4px 12px; font-size: 11px; font-weight: 500; border-radius: 6px;" onclick="resetAllCases()">全編集内容をリセット</button>
        </div>
    </header>

    <main>
        <div class="hero-section">
            <h1>IS実戦ロープレ・シミュレーター</h1>
        </div>

        <div class="random-large-wrapper">
            <button class="btn-random-large" onclick="pickRandomCase()"> シナリオをランダム選出</button>
        </div>

        <div class="filter-wrapper">
            <button class="filter-btn active" id="btn-all" onclick="filterDifficulty('all')">すべて</button>
            <button class="filter-btn" id="btn-easy" onclick="filterDifficulty('easy')">★1〜2 (初級)</button>
            <button class="filter-btn" id="btn-mid" onclick="filterDifficulty('mid')">★3〜4 (中級)</button>
            <button class="filter-btn" id="btn-hard" onclick="filterDifficulty('hard')">★5 (上級)</button>
        </div>

        <div class="grid-container" id="gridContainer">
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-window" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="hideModal()">×</button>
            
            <!-- 閲覧モード表示用 -->
            <div id="modalViewMode">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span class="case-id" id="modalCaseId">CASE 01</span>
                    <span class="difficulty" id="modalDifficulty">★★★★★</span>
                </div>
                <h2 class="case-target" id="modalTarget">学年 / 属性</h2>
                <div class="case-tone" id="modalTone">お電話口の第一声トーン</div>
                
                <div class="section-title">顧客ステータス / 他社接触</div>
                <div class="section-content" id="modalStatus"></div>

                <div class="section-title">顧客のスタンス（主導権の指示）</div>
                <div class="section-content" id="modalControl"></div>

                <div class="section-title">裏側に持っている本音（設定）</div>
                <div class="section-content" id="modalHonneh"></div>

                <div class="section-title">壁のトリガー（地雷）</div>
                <div class="section-content" id="modalTrigger" style="color: #c93b3b; font-weight: 500;"></div>

                <div class="highlight-box">
                    <div class="section-title">攻略の鍵（青信号・決定版トーク）</div>
                    <div class="section-content" id="modalKey"></div>
                </div>

                <!-- 編集・リセットアクションボタン -->
                <div style="display:flex; gap:12px; margin-top:24px; justify-content:flex-end; border-top: 1px solid var(--border-color); padding-top: 16px;">
                    <button class="action-btn secondary-btn" id="btnResetCase" style="display:none;" onclick="resetSingleCase()">このケースを初期設定に戻す</button>
                    <button class="action-btn primary-btn" onclick="enterEditMode()">✏️ 編集する</button>
                </div>
            </div>

            <!-- 編集モードフォーム用 -->
            <div id="modalEditMode" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span class="case-id" id="editCaseId">CASE 01</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:12px; color:var(--text-sub);">難易度:</span>
                        <select id="editDifficulty" class="edit-select" style="padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size:13px; background: #fff; cursor: pointer;">
                            <option value="1">★ (1)</option>
                            <option value="2">★★ (2)</option>
                            <option value="3">★★★ (3)</option>
                            <option value="4">★★★★ (4)</option>
                            <option value="5">★★★★★ (5)</option>
                        </select>
                    </div>
                </div>

                <div class="edit-field">
                    <label class="section-title-label">学年 / 属性</label>
                    <input type="text" id="editTarget" class="edit-input" />
                </div>

                <div class="edit-field">
                    <label class="section-title-label">お電話口の第一声トーン</label>
                    <input type="text" id="editTone" class="edit-input" />
                </div>

                <div class="edit-field">
                    <label class="section-title-label">顧客ステータス / 他社接触</label>
                    <textarea id="editStatus" class="edit-textarea" rows="2"></textarea>
                </div>

                <div class="edit-field">
                    <label class="section-title-label">顧客のスタンス（主導権の指示）</label>
                    <textarea id="editControl" class="edit-textarea" rows="2"></textarea>
                </div>

                <div class="edit-field">
                    <label class="section-title-label">裏側に持っている本音（設定）</label>
                    <textarea id="editHonneh" class="edit-textarea" rows="3"></textarea>
                </div>

                <div class="edit-field">
                    <label class="section-title-label" style="color: #c93b3b; border-left-color: #c93b3b;">壁のトリガー（地雷）</label>
                    <textarea id="editTrigger" class="edit-textarea" rows="2" style="border-color: rgba(229, 70, 70, 0.3); color: #c93b3b; background: rgba(229, 70, 70, 0.02);"></textarea>
                </div>

                <div class="edit-field highlight-box-edit">
                    <label class="section-title-label" style="color: var(--accent-green); border-left-color: var(--accent-green); margin-top: 0;">攻略の鍵（青信号・決定版トーク）</label>
                    <textarea id="editKey" class="edit-textarea" rows="3" style="border-color: rgba(52, 199, 89, 0.3); background: #ffffff;"></textarea>
                </div>

                <div class="edit-actions" style="display:flex; gap:12px; margin-top:24px; justify-content:flex-end; border-top: 1px solid var(--border-color); padding-top: 16px;">
                    <button class="action-btn secondary-btn" onclick="exitEditMode()">キャンセル</button>
                    <button class="action-btn primary-btn" onclick="saveCaseChanges()">変更を保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultCases = [
            {
                id: "01",
                grade: "小4 / 公立",
                difficulty: 3,
                stars: "★★★☆☆",
                tone: "「あ、はい。資料届きました。えっとね、ちょっと聞きたいんだけど…（早口、前のめり）」",
                status: "【情報過多・マシンガントーク型】\nネットやSNSの記事、他社のパンフレットを読み漁っている状態。",
                control: "【顧客が主導権を握り気味】自分の調べた知識を捲し立ててこちらにYES/NOを迫ろうとする。呑まれずに一度引き取るスタンスが必要。",
                honneh: "周りの友達が塾に通い始め、親として「うちも中学受験を考えたほうがいいのか」と焦り始めている。しかし、情報が多すぎて私立・国立・公立一貫校のどれが我が子に合うのか、そもそも受験に向いているのかが分からず思考停止している。",
                trigger: "プレイヤーが「まずは現在の学力は？」など、現実の数字を詰めようとすると、防衛モードに入り「あ、じゃあまた自分で調べてからにしますね」と濁して電話を切ろうとする。",
                key: "マシンガントークを一度受け止め、「皆様、最初はまずは情報収集ですよね〜！」と同調する。\n「実は、最初から受験校を決めている方よりも、まずはどんな選択肢があるのかフラットに情報を集めに来られる方がほとんどなんですよ」とハードルを下げて安心させる。"
            },
            {
                id: "02",
                grade: "小5 / 公立",
                difficulty: 4,
                stars: "★★★★☆",
                tone: "「あ、はい…届いてます…（ため息混じり、疲弊している、声が低い）」",
                status: "【状況を完璧に把握・精神的限界型】\n現在大手の集団塾（中学受験コース）に在籍中。限界を感じて他を探し始めた一発目。",
                control: "【顧客が主導権を放棄しつつ拒絶】かなり疲弊しており、会話のラリーすら拒もうとする。こちらから包み込むような主導権の引き戻しが必要。",
                honneh: "小4から大手の集団塾に通っているがクラスが一番下から上がらず、最近は塾の宿題をこなすだけで精一杯。子どもが「塾に行きたくない、お腹痛い」と言い始めており、転塾か受験撤退かを真剣に悩んでいる。",
                trigger: "プレイヤーが「体験授業でプロがお子さんのやる気を出します！」のような明るすぎる営業トーンでいくと、直接反論はしてこないが、心の中で（そういう問題じゃないのよ…）と感じて「あ、主人の意見も聞いてからまた検討しますね…」とフェードアウトする。",
                key: "「お母様もそこまで見ていらっしゃるの、本当に頭が下がる思いです。今一番しんどい時期ですよね」と親の精神的疲弊に100%共感する。\nその上で「実は今の集団塾さんのペースがしんどくなって、一度お子様の負担を減らすための『見直し』としてご相談に来られる方が非常に多いんですよ」と安全な逃げ道を用意する。"
            },
            {
                id: "03",
                grade: "小6 / 公立",
                difficulty: 1,
                stars: "★☆☆☆☆",
                tone: "「あ、もしもし〜。あぁ、資料のね。はいはい（低め、のんびり、他人事）」",
                status: "【配偶者から聞いた・のんびり型】\n塾への問い合わせは今回が完全に初めて。右も左も分かっていない。",
                control: "【主導権は完全にこちら】お父様が伝書鳩状態のため抵抗は薄いが、中身を何も知らないため、こちらから優しくナビゲートしてあげる必要がある。",
                honneh: "中学受験はしない。小学校の単元テストは80〜100点くらいでそこそこ取れているが、カラーテストの裏面の応用問題や、算数の「割合」「文章題」で時々ポロポロ落とす。中学校に入ってから英語や数学で置いていかれないか心配とお母様が言っていたのをそのまま伝えている。",
                trigger: "パパを置いてきぼりにして「お子さんの現在のテストの点数は細かく分かりますか？」と詰め寄ると、「あー、どうですかね、妻がそう言ってて詳しくはわからないんですけど〜、また聞いておきます」と濁されて終わる。",
                key: "「お母様がそこまで心配されているんですね」と伝書鳩状態のお父様を肯定する。\n「お父様方からは『妻に一回聞いてこいって言われて〜』と仰って最初にご相談いただくケース、実はめちゃくちゃ多いんです」とマジョリティに巻き込み、お父様の記憶にある“妻の懸念”を優しく引き出す。"
            },
            {
                id: "04",
                grade: "小5 / 私立（一貫校）",
                difficulty: 2,
                stars: "★★☆☆☆",
                tone: "「あ、はーい。資料届きましたよ〜。どうも〜（軽め、ハキハキしているがどこか他人事）」",

                tone: "「あ、もしもし。資料届きました。ちょっと特殊な状況なんですけど、大学受験の相談って乗ってもらえますか？（自信なさげ、恐る恐る）」",
                status: "【特殊背景・不安型】\n全日制の高校を中退、または通信制高校に在籍しており、集団の予備校には通えないため、個別でひっそり進めたい。",
                control: "【顧客は完全受け身・過去の挫折あり】\n偏見のないフラットな受け入れ姿勢を提示し、現状の学力から「無駄なく最短で大学へ行くルート」を見せることで信頼を得る。",
                honneh: "体調や人間関係で高校を中退したが、大学には行きたい。高卒認定資格を取るか、通信制の課題をこなしながら、一般入試（または総合型）で狙える大学を探している。中学レベルから英語や数学が止まっているため、基礎の基礎から戻って教えてくれる場所を探している。",
                trigger: "「今の偏差値はいくつですか？共通テストの目標は？」といきなり受験生の標準的なファクトを詰めると、恥ずかしがって「やっぱり大丈夫です」と逃げてしまう。",
                key: "「お問い合わせありがとうございます。もちろん大丈夫ですよ、ご安心くださいね。これって、今の学力や学校の形式に関わらず、そもそも『今の状態から、どういうスケジュールで大学受験まで進めていくのが一番確実なのか』、そのルートから一緒に整理したいという感じでしょうか？」"
            },
            {
                id: "30",
                grade: "小4 / 公立",
                difficulty: 3,
                stars: "★★★☆☆",
                tone: "「あ、もしもし。資料ありがとうございました。今、海外に住んでいまして、一時帰国の期間だけ利用したいんですが…（国際電話、または日本の実家からの転送トーン、少し急いでいる）」",
                status: "【超短期・目的特化型】\n滞在期間が「1ヶ月のみ」など決まっているため、大手塾には断られてこちらに流れ着いた。",
                control: "【顧客が条件面で主導権を握る】\n期間と回数の要望がガチガチ。できる・できないのYES/NOに走らず、その1ヶ月で「何をどこまで引き上げるか」の中身の整理として引き取る。",
                honneh: "現在アジアや米国の日本人学校（または現地校）に在籍。現地では日本語の「算数の文章題」や「漢字・国語の読解」を教える環境がなく、日本の同学年と比べて明らかに遅れている。夏休みなどの1ヶ月の一時帰国を利用して、プロにピンポイントで穴埋めをしてほしい。",
                trigger: "「短期のプランは通常やっていなくて、年間契約が〜」などと既存の規約を盾に突っぱねると、その瞬間に会話が終わる。",
                key: "「具体的に調べられているんですね。これって、長期間ダラダラ通うというよりは、『一時帰国の限られた期間だけで、日本の学校の進度に合わせた苦手な単元をピンポイントで埋めたい』という状況ですか？」"
            }
        ];

        // 実際の動作設定
        let cases = [];
        let activeCase = null; // 現在モーダルで開いているケースの参照
        let currentFilter = 'all';

        // Load data from local storage or use default
        function loadCases() {
            const saved = localStorage.getItem('is_rp_cases');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // defaultCasesのIDと整合性をとってマージ (コードに新ケースが追加された場合でもデータが壊れないように)
                    const parsedMap = new Map(parsed.map(item => [item.id, item]));
                    cases = defaultCases.map(def => {
                        if (parsedMap.has(def.id)) {
                            return { ...def, ...parsedMap.get(def.id) };
                        }
                        return def;
                    });
                } catch (e) {
                    cases = JSON.parse(JSON.stringify(defaultCases));
                }
            } else {
                cases = JSON.parse(JSON.stringify(defaultCases));
            }
        }

        function getDifficultyGroup(score) {
            if (score <= 2) return 'easy';
            if (score <= 4) return 'mid';
            return 'hard';
        }

        function renderGrid(filter = 'all') {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            cases.forEach(c => {
                const group = getDifficultyGroup(c.difficulty);
                if (filter !== 'all' && filter !== group) return;

                const card = document.createElement('div');
                card.className = 'case-card';
                card.onclick = () => showModal(c);
                const isEditedBadge = c.edited ? '<span class="edited-badge">編集済み</span>' : '';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="case-id">CASE ${c.id} ${isEditedBadge}</span>
                            <span class="difficulty">${c.stars}</span>
                        </div>
                        <div class="case-target">${c.grade}</div>
                        <div class="case-tone">${c.tone.substring(0, 45)}...</div>
                        <div>
                            <span class="meta-tag">${c.status.split('\n')[0].replace(/【|】/g, '')}</span>
                        </div>
                    </div>
                    <div class="card-footer-info">
                        <span>詳細設定・攻略の鍵を表示 →</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterDifficulty(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            
            const btnMap = {
                'all': 'btn-all',
                'easy': 'btn-easy',
                'mid': 'btn-mid',
                'hard': 'btn-hard'
            };
            const targetBtn = document.getElementById(btnMap[type]);
            if (targetBtn) {
                targetBtn.classList.add('active');
            }
            renderGrid(type);
        }

        function showModal(c) {
            activeCase = c;
            exitEditMode(); // 常に閲覧モードで開くようにする

            document.getElementById('modalCaseId').innerText = `CASE ${c.id}`;
            document.getElementById('modalDifficulty').innerText = c.stars;
            document.getElementById('modalTarget').innerText = c.grade;
            document.getElementById('modalTone').innerText = c.tone;
            document.getElementById('modalStatus').innerText = c.status;
            document.getElementById('modalControl').innerText = c.control;
            document.getElementById('modalHonneh').innerText = c.honneh;
            document.getElementById('modalTrigger').innerText = c.trigger;
            document.getElementById('modalKey').innerText = c.key;

            // 編集済みなら「初期設計に戻す」ボタンを表示
            const btnReset = document.getElementById('btnResetCase');
            if (btnReset) {
                btnReset.style.display = c.edited ? 'block' : 'none';
            }

            document.getElementById('gridContainer').classList.add('blur-bg');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function hideModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('gridContainer').classList.remove('blur-bg');
        }

        function closeModal(e) {
            if (e.target.id === 'modalOverlay') {
                hideModal();
            }
        }

        function pickRandomCase() {
            hideModal();
            setTimeout(() => {
                const filteredList = cases.filter(c => {
                    if (currentFilter === 'all') return true;
                    return getDifficultyGroup(c.difficulty) === currentFilter;
                });
                
                if (filteredList.length === 0) return;
                const randomIndex = Math.floor(Math.random() * filteredList.length);
                showModal(filteredList[randomIndex]);
            }, 200);
        }

        // --- 編集モード用のJSロジック ---
        function enterEditMode() {
            if (!activeCase) return;
            
            document.getElementById('modalViewMode').style.display = 'none';
            document.getElementById('modalEditMode').style.display = 'block';

            document.getElementById('editCaseId').innerText = `CASE ${activeCase.id}`;
            document.getElementById('editDifficulty').value = activeCase.difficulty;
            document.getElementById('editTarget').value = activeCase.grade || '';
            document.getElementById('editTone').value = activeCase.tone || '';
            document.getElementById('editStatus').value = activeCase.status || '';
            document.getElementById('editControl').value = activeCase.control || '';
            document.getElementById('editHonneh').value = activeCase.honneh || '';
            document.getElementById('editTrigger').value = activeCase.trigger || '';
            document.getElementById('editKey').value = activeCase.key || '';
        }

        function exitEditMode() {
            document.getElementById('modalEditMode').style.display = 'none';
            document.getElementById('modalViewMode').style.display = 'block';
        }

        function saveCaseChanges() {
            if (!activeCase) return;

            const newGrade = document.getElementById('editTarget').value.trim();
            const newTone = document.getElementById('editTone').value.trim();
            if (!newGrade || !newTone) {
                alert('学年/属性と第一声トーンは必須項目です。');
                return;
            }

            const diffVal = parseInt(document.getElementById('editDifficulty').value);
            activeCase.difficulty = diffVal;
            activeCase.stars = "★".repeat(diffVal) + "☆".repeat(5 - diffVal);
            activeCase.grade = newGrade;
            activeCase.tone = newTone;
            activeCase.status = document.getElementById('editStatus').value;
            activeCase.control = document.getElementById('editControl').value;
            activeCase.honneh = document.getElementById('editHonneh').value;
            activeCase.trigger = document.getElementById('editTrigger').value;
            activeCase.key = document.getElementById('editKey').value;
            activeCase.edited = true;

            // Save to localStorage
            localStorage.setItem('is_rp_cases', JSON.stringify(cases));

            // Refresh UI
            renderGrid(currentFilter);
            
            // Update view mode display
            showModal(activeCase);
            
            // Back to view mode
            exitEditMode();
        }

        function resetSingleCase() {
            if (!activeCase) return;
            if (!confirm('このケースの変更内容をリセットして、初期設定に戻しますか？')) return;

            const def = defaultCases.find(item => item.id === activeCase.id);
            if (def) {
                activeCase.difficulty = def.difficulty;
                activeCase.stars = def.stars;
                activeCase.grade = def.grade;
                activeCase.tone = def.tone;
                activeCase.status = def.status;
                activeCase.control = def.control;
                activeCase.honneh = def.honneh;
                activeCase.trigger = def.trigger;
                activeCase.key = def.key;
                activeCase.edited = false;

                // Save
                localStorage.setItem('is_rp_cases', JSON.stringify(cases));

                // Refresh UI
                renderGrid(currentFilter);
                showModal(activeCase);
                exitEditMode();
            }
        }

        function resetAllCases() {
            if (!confirm('すべての編集内容をリセットし、初期設定に戻しますか？（この操作は元に戻せません）')) return;

            localStorage.removeItem('is_rp_cases');
            loadCases();
            renderGrid(currentFilter);
            hideModal();
            alert('すべての変更がリセットされました。');
        }

        // Initial Render
        loadCases();
        renderGrid();
    </script>
</body>
</html>
